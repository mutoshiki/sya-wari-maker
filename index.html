<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>山歩会 車割メーカー</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
<style>
:root {
    --bg-body: #f4f7f6;
    --text-main: #333;
    --bg-card: #fff;
    --border-color: #e0e0e0;
    --card-shadow: 0 2px 5px rgba(0,0,0,0.05);
    --driver-bg: #f0f2f5;
    --driver-text: #495057;
    --seat-bg: #f8f9fa;
    --drag-over-bg: #e9ecef;
    --share-bar-bg: rgba(255,255,255,0.95);
    --input-bg: #fff;
    --input-text: #495057;
    --input-border: #ced4da;
    --ghost-bg: #c8c8c8;
    --modal-bg: #fff;
    --modal-border: #dee2e6;
    --bg-male: #e3f2fd;
    --border-male: #90caf9;
    --text-male: #0d47a1;
    --bg-female: #fce4ec;
    --border-female: #f48fb1;
    --text-female: #880e4f;
    --driver-bg-male: #bbdefb;
    --driver-text-male: #0d47a1;
    --driver-bg-female: #f8bbd0;
    --driver-text-female: #880e4f;
    --freshman-color: #2e7d32;
    --locked-color: #ffc107;
    color-scheme: light;
}
[data-theme="dark"] {
    --bg-body: #121212;
    --text-main: #e0e0e0;
    --bg-card: #2a2a2a;
    --border-color: #444;
    --card-shadow: 0 2px 5px rgba(0,0,0,0.3);
    --driver-bg: #333;
    --driver-text: #ccc;
    --seat-bg: #222;
    --drag-over-bg: #3a3a3a;
    --share-bar-bg: rgba(30,30,30,0.95);
    --input-bg: #333;
    --input-text: #e0e0e0;
    --input-border: #555;
    --ghost-bg: #555;
    --modal-bg: #2a2a2a;
    --modal-border: #444;
    --bg-male: rgba(13, 71, 161, 0.3);
    --border-male: #1565c0;
    --text-male: #90caf9;
    --bg-female: rgba(136, 14, 79, 0.3);
    --border-female: #ad1457;
    --text-female: #f48fb1;
    --driver-bg-male: rgba(13, 71, 161, 0.5);
    --driver-text-male: #90caf9;
    --driver-bg-female: rgba(136, 14, 79, 0.5);
    --driver-text-female: #f48fb1;
    --freshman-color: #81c784;
    color-scheme: dark;
}
[data-theme="dark"] .text-secondary { color: #a0a0a0 !important; }
[data-theme="dark"] .btn-close { filter: invert(1); }
body { background-color: var(--bg-body); color: var(--text-main); font-family: 'Helvetica Neue', Arial, sans-serif; padding-bottom: 100px; transition: background-color 0.3s, color 0.3s; font-size: 0.95rem; }
.form-control, .form-select, .input-group-text { background-color: var(--input-bg); color: var(--input-text); border-color: var(--input-border); }
.form-control:focus { border-color: #80bdff; box-shadow: 0 0 0 0.2rem rgba(0,123,255,.25); background-color: var(--input-bg); color: var(--input-text); }
.form-control::placeholder { color: var(--input-text); opacity: 0.6; }
.member-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px 10px; cursor: grab; box-shadow: var(--card-shadow); color: var(--text-main); margin-bottom: 0; display: flex; flex-direction: column; touch-action: manipulation; transition: all 0.2s; }
.member-card:active { cursor: grabbing; transform: scale(0.98); }
.member-card[data-gender="male"] { background-color: var(--bg-male); border-color: var(--border-male); color: var(--text-male); }
.member-card[data-gender="female"] { background-color: var(--bg-female); border-color: var(--border-female); color: var(--text-female); }
.member-card[data-locked="true"] { border-color: var(--locked-color); border-width: 2px; box-shadow: 0 0 5px rgba(255, 193, 7, 0.5); }
.lock-btn { color: #aaa; margin-right: 8px; transition: color 0.2s; }
.lock-btn:hover { color: var(--text-main); }
.member-card[data-locked="true"] .lock-btn { color: var(--locked-color); opacity: 1; }
.card-top-row { display: flex; align-items: center; font-size: 1rem; line-height: 1.2; width: 100%; }
.member-name-text { font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-grow: 1; margin: 0 6px; }
.card-bottom-row { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 6px; font-size: 0.85rem; }
.action-btn { cursor: pointer; padding: 2px 4px; color: #aaa; transition: color 0.2s; }
.action-btn:hover { color: var(--text-main); }
.edit-name-btn { cursor: pointer; font-size: 0.8em; color: inherit; opacity: 0.6; transition: opacity 0.2s; }
.edit-name-btn:hover { opacity: 1; }
.gender-btn { cursor: pointer; margin-right: 4px; font-size: 1.1em; }
[data-gender="male"] .gender-btn { color: #1976d2; } [data-gender="female"] .gender-btn { color: #c2185b; }
.freshman-icon { color: var(--freshman-color); margin-right: 4px; font-size: 1em; }
.memo-indicator { font-size: 0.9rem; color: #ffc107; cursor: pointer; margin-right: 6px; transition: transform 0.2s; }
.memo-indicator:hover { transform: scale(1.1); }
.memo-indicator.empty { color: var(--border-color); opacity: 0.6; }
.memo-popup { font-size: 0.8rem; color: #555; background: #fff9c4; padding: 4px 6px; border-radius: 4px; border: 1px solid #ffe082; margin-top: 4px; display: none; width: 100%; word-break: break-all; line-height: 1.2; }
[data-theme="dark"] .memo-popup { background: #423c18; color: #fff9c4; border-color: #635b2e; }
.car-box { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; position: relative; box-shadow: var(--card-shadow); }
.car-header { font-weight: bold; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--border-color); font-size: 1.05rem; }
.car-box.over-capacity { border-color: #dc3545; background-color: rgba(220,53,69,0.05); }
.car-interior-layout { display: flex; flex-direction: column; gap: 8px; }
.front-row { display: flex; gap: 8px; }
.seat-area { flex: 1; min-height: 60px; border-radius: 8px; padding: 4px; background-color: var(--seat-bg); transition: background-color 0.2s; }
.sortable-area { border: 2px dashed var(--border-color); }
.sortable-area.drag-over { background-color: var(--drag-over-bg); border-color: #0d6efd; }
.rear-seats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-content: start; }
.driver-seat { background-color: var(--driver-bg); color: var(--driver-text); border: 1px solid var(--border-color); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; font-size: 0.95rem; user-select: none; }
.driver-seat[data-gender="male"] { background: var(--driver-bg-male); color: var(--driver-text-male); border-color: var(--border-male); }
.driver-seat[data-gender="female"] { background: var(--driver-bg-female); color: var(--driver-text-female); border-color: var(--border-female); }
.driver-label { font-size: 0.7em; opacity: 0.8; text-align: right; margin-bottom: 4px; line-height: 1; font-weight: bold; letter-spacing: 0.5px;}
.waiting-area { background-color: rgba(0,0,0,0.03); border-radius: 10px; padding: 10px; min-height: 100px; display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; border: 2px dashed var(--border-color); transition: background-color 0.2s, border-color 0.2s; }
[data-theme="dark"] .waiting-area { background-color: rgba(255,255,255,0.03); }
.waiting-area.drag-over { background-color: var(--drag-over-bg); border-color: #0d6efd; }
.waiting-area .member-card { width: calc(33.333% - 6px); }
@media (max-width: 768px) { .waiting-area .member-card { width: calc(50% - 4px); } }
.share-bar { position: fixed; bottom: 0; left: 0; right: 0; background: var(--share-bar-bg); border-top: 1px solid var(--border-color); padding: 12px 15px 15px; z-index: 1000; backdrop-filter: blur(5px); box-shadow: 0 -2px 5px rgba(0,0,0,0.1); }
.sortable-ghost { background-color: var(--ghost-bg) !important; opacity: 0.6; border: 2px dashed #888; }
.dropdown-menu { background-color: var(--modal-bg); border-color: var(--modal-border); box-shadow: 0 4px 8px rgba(0,0,0,0.1); color: var(--text-main); }
.dropdown-item { color: var(--text-main); }
.dropdown-item:hover { background-color: var(--drag-over-bg); color: var(--text-main); }
.dropdown-header { color: var(--text-main); opacity: 0.7; font-weight: bold; }
.dropdown-menu .form-check-label { color: var(--text-main); cursor: pointer; }
.modal-content { background-color: var(--modal-bg); color: var(--text-main); border-color: var(--modal-border); border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
.modal-header, .modal-footer { border-color: var(--modal-border); }
.btn-group .btn i, .btn-outline-danger i { font-size: 1.1em; }
</style>
</head>
<body data-theme="light">
<div class="container py-3">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="mb-0 fs-5 fw-bold text-nowrap"><i class="fas fa-mountain text-success me-2"></i>車割メーカー</h2>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-warning btn-sm text-dark fw-bold" data-action="batch"><i class="fas fa-paste me-1"></i>一括登録</button>
            <button class="btn btn-outline-danger btn-sm" data-action="reset"><i class="fas fa-redo-alt"></i></button>

                    <button class="btn btn-outline-secondary btn-sm" style="font-size:0.8rem;" data-action="auto" data-mode="fill"><i class="fas fa-plus me-1"></i>埋める</button>
                    <button class="btn btn-outline-secondary btn-sm" style="font-size:0.8rem;" data-action="auto" data-mode="shuffle"><i class="fas fa-random me-1"></i>シャッフル</button>

                        <div class="form-check"><input class="form-check-input" type="checkbox" id="optMale"><label class="form-check-label" for="optMale">🚹 男子をまとめる</label></div>

                <button class="btn btn-outline-danger btn-sm" style="font-size:0.8rem;" data-action="clear"><i class="fas fa-reply-all me-1"></i>全解除</button>

</div>
<div class="share-bar">
    <div class="container" style="max-width:600px;">
        <div class="row g-2">
            <div class="col-6"><button class="btn btn-outline-primary w-100 py-1 fw-bold" data-action="copyLine"><i class="far fa-copy me-2"></i>LINE用</button></div>

</div>
<div class="modal fade" id="commonEditModal" tabindex="-1"><div class="modal-dialog modal-dialog-centered modal-sm"><div class="modal-content"><div class="modal-header py-2"><h5 class="modal-title fs-6" id="editModalTitle">編集</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><input type="text" id="editModalInput" class="form-control" autocomplete="off"></div><div class="modal-footer py-1"><button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">キャンセル</button><button type="button" class="btn btn-primary btn-sm" id="saveEditBtn">保存</button></div></div></div></div>
<div class="modal fade" id="batchImportModal" tabindex="-1"><div class="modal-dialog modal-xl modal-dialog-centered"><div class="modal-content"><div class="modal-header"><h5 class="modal-title">一括登録</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body"><div class="row g-3"><div class="col-md-4"><label class="form-label fw-bold text-primary small">同乗者</label><textarea id="batchMembers" class="form-control batch-textarea" style="min-height:150px;"></textarea></div><div class="col-md-4"><label class="form-label fw-bold text-success small">1年生</label><textarea id="batchFreshmen" class="form-control batch-textarea" style="min-height:150px;"></textarea></div><div class="col-md-4"><label class="form-label fw-bold text-secondary small">運転手</label><textarea id="batchDrivers" class="form-control batch-textarea" style="min-height:150px;"></textarea></div></div></div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">キャンセル</button><button type="button" class="btn btn-primary" id="execBatchBtn">登録</button></div></div></div></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCBJhqD5T05TTQqWw3d2bFbr6keSe9mRyE",
  authDomain: "syawari-maker.firebaseapp.com",
  databaseURL: "https://syawari-maker-default-rtdb.firebaseio.com",
  projectId: "syawari-maker",
  storageBucket: "syawari-maker.firebasestorage.app",
  messagingSenderId: "1050069471490",
  appId: "1:1050069471490:web:fd91fb2b0b54edb46ef21b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
let dbRef;
let isRemoteUpdate = false;

// ルームIDの取得または生成
const urlParams = new URLSearchParams(window.location.search);
let roomId = urlParams.get('room');
if (!roomId) {
    roomId = Math.random().toString(36).substring(2, 8);
    const newUrl = `${window.location.pathname}?room=${roomId}`;
    window.history.replaceState(null, null, newUrl);
}
dbRef = ref(db, 'rooms/' + roomId);

const D=document, L=localStorage, J=JSON;
const $=(s,p=D)=>p.querySelector(s), $$=(s,p=D)=>p.querySelectorAll(s), ce=(t,c)=>{const e=D.createElement(t);if(c)e.className=c;return e}, getInt=v=>parseInt(v)||0;
const CFG = {
    KEY:'6974b918d0998f075852411e', STORE:'sampokai_car_data_v8_compact',
    ICONS:{male:'fa-mars',female:'fa-venus',unknown:'fa-venus-mars'}, TITLES:{male:'男性',female:'女性',unknown:'未設定'}
};
let modals={}, saveCb;

D.addEventListener('DOMContentLoaded', () => {
    modals = { edit: new bootstrap.Modal($('#commonEditModal')), batch: new bootstrap.Modal($('#batchImportModal')) };
    
    D.body.onclick = e => {
        const t = e.target, d = t.dataset;
        const act = d.action || t.getAttribute('action'); 
        const cls = t.classList;
        
        if (cls.contains('gender-btn')) { toggleGender(t); return; }
        if (cls.contains('edit-btn') || cls.contains('edit-name-btn') || d.edit) { handleEdit(d.edit || (cls.contains('edit-name-btn')?(t.closest('.member-card')?'name':'carName'):(t.closest('.driver-seat')?'driverMemo':'memo')), t); return; }
        if (cls.contains('lock-btn')) { toggleLock(t.closest('.member-card')); return; }
        
        if (!act) return;

        const box = t.closest('.car-box'), card = t.closest('.member-card');
        const ACTIONS = {
            delete: () => {
                if(card && card.dataset.locked==='true') return alert('ロックされています');
                if(card && card.closest('#waiting-list') && confirm('削除しますか？')) card.remove();
                else if(card) $('#waiting-list').appendChild(card);
                else if(box && confirm('車を削除しますか？')) { 
                    $$('.member-card', box).forEach(m => {
                         if(m.dataset.locked!=='true') $('#waiting-list').appendChild(m);
                         else if(confirm(`${$('.member-name-text',m).innerText}はロックされていますが、削除してよろしいですか？`)) $('#waiting-list').appendChild(m);
                    }); 
                    if($$('.member-card', box).length === 0) box.closest('.col-md-6').remove();
                }
                updateUI(); save();
            },
            return: () => { 
                if(card.dataset.locked==='true') return;
                $('#waiting-list').appendChild(card); updateUI(); save(); 
            },
            batch: () => { $$('.batch-textarea').forEach(e=>e.value=''); modals.batch.show(); },
            addCar: () => addCar(), addMember: () => addMember(),
            auto: () => autoAssign(d.mode),
            clear: () => { 
                if(confirm('ロックされていないメンバーを全解除しますか？')) { 
                    $$('.car-interior-layout .member-card:not([data-locked="true"])').forEach(m => $('#waiting-list').appendChild(m)); 
                    updateUI(); save(); 
                }
            },
            reset: () => { if(confirm('リセット？')) { L.removeItem(CFG.STORE); location.href = location.pathname; }},
            copyUrl: () => copy(window.location.href),
            copyLine: () => copyLine()
        };
        if(ACTIONS[act]) ACTIONS[act]();
    };

    $('#saveEditBtn').onclick = () => { saveCb && saveCb(); };
    $('#execBatchBtn').onclick = executeBatch;
    $('#editModalInput').onkeypress = e => { if(e.key==='Enter' && saveCb) saveCb(); };
    $('#newMemberName').onkeypress = e => { if(e.key==='Enter') addMember(); };

    load(); // Firebase同期を開始

    setupSortable($('#waiting-list'));
    const mql = window.matchMedia('(prefers-color-scheme: dark)');
    const checkTheme = () => D.body.dataset.theme = mql.matches ? 'dark' : 'light';
    checkTheme();
    mql.addEventListener('change', checkTheme);
});

const renderGender = (el,g) => { el.className=`fas gender-btn ${CFG.ICONS[g]}`; el.title=CFG.TITLES[g]; };
async function detectGender(name, el, isDriver) {
    if (!name) return;
    try {
        // ご希望の genderize.io APIを使用
        const res = await fetch(`https://api.genderize.io/?name=${encodeURIComponent(name)}`);
        const d = await res.json();
        
        if (d && d.gender) {
            // パターンA: まだ元の要素が画面に残っている場合（そのまま更新）
            if (el.isConnected) {
                el.dataset.gender = d.gender;
                const btn = el.querySelector('.gender-btn');
                if (btn) renderGender(btn, d.gender);
            } 
            // パターンB: Firebaseの同期により画面が再描画され、元の要素が消えていた場合
            // → 画面全体から「同じ名前」の要素を探し出して更新する（これがFirebase対策の肝です）
            else {
                const selector = isDriver ? '.driver-seat' : '.member-card';
                const nameSelector = isDriver ? '.driver-name-disp' : '.member-name-text';
                
                // 画面上の全要素からこの名前の人を探す
                const targets = document.querySelectorAll(selector);
                targets.forEach(target => {
                    const nameEl = target.querySelector(nameSelector);
                    // 名前が一致したら性別を書き込む
                    if (nameEl && nameEl.innerText === name) {
                         target.dataset.gender = d.gender;
                         const btn = target.querySelector('.gender-btn');
                         if (btn) renderGender(btn, d.gender);
                    }
                });
            }
            save(); // 保存して同期
        }
    } catch (e) {
        console.error("Gender Detect Error:", e);
    }
}
function toggleGender(btn) {
    const p = btn.closest(btn.closest('.member-card') ? '.member-card' : '.driver-seat');
    const next = {unknown:'male',male:'female',female:'unknown'}[p.dataset.gender]||'male';
    p.dataset.gender = next; renderGender(btn, next); save();
}
function toggleLock(card) {
    const isLocked = card.dataset.locked === 'true';
    card.dataset.locked = !isLocked;
    const icon = $('.lock-btn', card);
    icon.className = `fas lock-btn action-btn ${!isLocked ? 'fa-lock' : 'fa-unlock'}`;
    icon.title = !isLocked ? '固定中(自動移動しません)' : '固定解除';
    save();
}

function addMember(n, m='', g='unknown', f=false, parent=$('#waiting-list'), locked=false) {
    const name = n || $('#newMemberName').value; if(!name) return;
    const d = ce('div', 'member-card'); Object.assign(d.dataset, {gender:g, freshman:f, locked:locked});
    d.innerHTML = `<div class="card-top-row"><i class="fas gender-btn ${CFG.ICONS[g]}" title="${CFG.TITLES[g]}"></i>${f?'<i class="fas fa-leaf freshman-icon" title="1年生"></i>':''}<span class="member-name-text" title="${name}">${name}</span><i class="fas fa-pencil-alt edit-name-btn"></i></div><div class="memo-popup" style="display:${m?'block':'none'}">${m}</div><div class="card-bottom-row"><div class="d-flex align-items-center"><i class="fas fa-sticky-note memo-indicator ${m?'':'empty'} edit-btn"></i></div><div class="d-flex align-items-center"><i class="fas ${locked?'fa-lock':'fa-unlock'} action-btn lock-btn" title="${locked?'固定中':'固定解除'}"></i><i class="fas action-btn state-action-btn" data-action="${parent.id==='waiting-list'?'delete':'return'}"></i></div></div>`;
    parent.appendChild(d);
    if(!n) { $('#newMemberName').value=''; detectGender(name, d); save(); }
    return d;
}

function addCar(n, cap, mems=[], dm='', dg='unknown') {
    const name = n || $('#newCarName').value, c = cap || $('#newCarCapacity').value; if(!name) return;
    const col = ce('div', 'col-md-6 mb-2');
    col.innerHTML = `<div class="car-box" data-capacity="${c}"><div class="car-header"><div class="d-flex align-items-center"><i class="fas fa-car text-primary me-2"></i><span class="car-name-text">${name} 車</span></div><div><span class="badge capacity-badge me-2 bg-secondary" style="cursor:pointer;" data-edit="capacity">0/${c}</span><i class="fas fa-trash-alt action-btn delete-btn" data-action="delete"></i></div></div><div class="car-interior-layout"><div class="front-row"><div class="seat-area sortable-area passenger-seat"></div><div class="seat-area driver-seat" data-gender="${dg}"><div class="w-100"><span class="driver-label">DRIVER</span><div class="card-top-row"><i class="fas gender-btn ${CFG.ICONS[dg]}" title="driver"></i><span class="driver-name-disp fw-bold text-truncate" style="flex:1; margin:0 4px;">${name}</span><i class="fas fa-pencil-alt edit-name-btn"></i></div></div><div class="memo-popup driver-memo-text" style="display:${dm?'block':'none'}">${dm}</div><div class="card-bottom-row mt-1 w-100" style="border-top:1px dashed rgba(0,0,0,0.1); padding-top:2px;"><i class="fas fa-sticky-note memo-indicator ${dm?'':'empty'} edit-btn"></i></div></div></div><div class="seat-area sortable-area rear-seats"></div></div></div>`;
    $('#cars-container').appendChild(col);
    const [pS, rS] = [$('.passenger-seat',col), $('.rear-seats',col)];
    setupSortable(pS); setupSortable(rS);
    mems.forEach((m,i) => addMember(m.name,m.memo,m.gender,m.isFreshman,i===0?pS:rS, m.locked));
    if(!n) { $('#newCarName').value=''; detectGender(name,$('.driver-seat',col),true); save(); }
    updateUI();
}

function setupSortable(el) { new Sortable(el,{group:'shared',animation:150,ghostClass:'sortable-ghost',delay:100,delayOnTouchOnly:true,onEnd:()=>{updateUI();save();}}); }

function autoAssign(mode) {
    const opts = { f: $('#optFemale').checked, m: $('#optMale').checked, g: $('#optGrade').checked };
    const isSmartMode = opts.f || opts.m || opts.g;
    const getM = el => Array.from(el.children).filter(c => c.dataset.locked !== 'true').map(c => { const d = getMemData(c); c.remove(); return d; });
    let mems = getM($('#waiting-list'));

    if (mode === 'shuffle') {
        if (!confirm("ロックされていないメンバーを再編成しますか？")) {
            mems.forEach(m => addMember(m.name, m.memo, m.gender, m.isFreshman, $('#waiting-list'), m.locked)); 
            return;
        }
        $$('.car-box').forEach(c => { mems.push(...getM($('.passenger-seat', c)), ...getM($('.rear-seats', c))); });
    }

    if (!mems.length) return;
    const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
    mems = shuffle(mems); 
    let cars = shuffle(Array.from($$('.car-box')));

    if (!isSmartMode) {
        mems.forEach(member => {
            const availableCars = cars.filter(c => {
                const count = getCarMembers(c).length;
                return count < getInt(c.dataset.capacity);
            });
            if (availableCars.length > 0) {
                const car = availableCars[Math.floor(Math.random() * availableCars.length)];
                addMemberToCar(member, car);
            } else {
                addMember(member.name, member.memo, member.gender, member.isFreshman, $('#waiting-list'), member.locked);
            }
        });
        updateUI(); save(); return;
    }

    mems.sort((a, b) => {
        let pA = 0, pB = 0;
        if (opts.f && a.gender === 'female') pA += 20;
        if (opts.m && a.gender === 'male') pA += 20;
        if (opts.g && a.isFreshman) pA += 10;
        if (opts.f && b.gender === 'female') pB += 20;
        if (opts.m && b.gender === 'male') pB += 20;
        if (opts.g && b.isFreshman) pB += 10;
        return pB - pA;
    });

    mems.forEach(member => {
        let bestCar = null;
        let bestScore = -Infinity;
        cars.forEach(car => {
            if (getCarMembers(car).length >= getInt(car.dataset.capacity)) return;
            const currentMems = getCarMembersData(car);
            const driver = getDriverData(car);
            const score = calculateMemberScore(member, [driver, ...currentMems], opts);
            if (score > bestScore) { bestScore = score; bestCar = car; }
        });
        if (bestCar) addMemberToCar(member, bestCar);
        else addMember(member.name, member.memo, member.gender, member.isFreshman, $('#waiting-list'), member.locked);
    });

    optimizeDistribution(cars, opts);
    updateUI(); save();
}

function addMemberToCar(member, carElement) {
    const target = ($('.passenger-seat', carElement).children.length ? $('.rear-seats', carElement) : $('.passenger-seat', carElement));
    addMember(member.name, member.memo, member.gender, member.isFreshman, target, member.locked);
}
function getCarMembers(car) { return [...$$('.passenger-seat .member-card', car), ...$$('.rear-seats .member-card', car)]; }
function getCarMembersData(car) { return getCarMembers(car).map(getMemData); }
function getDriverData(car) { return { gender: $('.driver-seat', car).dataset.gender, isFreshman: false, isDriver: true }; }

function optimizeDistribution(cars, opts) {
    const iterations = 500; 
    for (let i = 0; i < iterations; i++) {
        const carA = cars[Math.floor(Math.random() * cars.length)];
        const carB = cars[Math.floor(Math.random() * cars.length)];
        if (carA === carB) continue;

        const memsA = getCarMembers(carA), memsB = getCarMembers(carB);
        const candA = memsA.length > 0 ? memsA[Math.floor(Math.random() * memsA.length)] : null;
        const candB = memsB.length > 0 ? memsB[Math.floor(Math.random() * memsB.length)] : null;

        if (!candA && !candB) continue;
        if ((candA && candA.dataset.locked === 'true') || (candB && candB.dataset.locked === 'true')) continue;

        const scoreBefore = getCarTotalScore(carA, opts) + getCarTotalScore(carB, opts);
        const dataA = getCarMembersData(carA), dataB = getCarMembersData(carB);
        const driverA = getDriverData(carA), driverB = getDriverData(carB);
        let newDataA = [...dataA], newDataB = [...dataB];

        if (candA) { const idxA = newDataA.findIndex(m => m.name === getMemData(candA).name); if (idxA > -1) newDataA.splice(idxA, 1); }
        if (candB) { const idxB = newDataB.findIndex(m => m.name === getMemData(candB).name); if (idxB > -1) newDataB.splice(idxB, 1); }

        const capA = getInt(carA.dataset.capacity), capB = getInt(carB.dataset.capacity);
        if (candB) newDataA.push(getMemData(candB));
        if (candA) newDataB.push(getMemData(candA));
        if (newDataA.length > capA || newDataB.length > capB) continue;

        const scoreAfter = calcGroupScore(newDataA, driverA, opts) + calcGroupScore(newDataB, driverB, opts);
        if (scoreAfter > scoreBefore) performSwap(carA, candA, carB, candB);
        else if (scoreAfter === scoreBefore && Math.random() < 0.1) performSwap(carA, candA, carB, candB);
    }
}

function performSwap(carA, memElA, carB, memElB) {
    const dataA = memElA ? getMemData(memElA) : null;
    const dataB = memElB ? getMemData(memElB) : null;
    if (memElA) memElA.remove();
    if (memElB) memElB.remove();
    if (dataA) addMemberToCar(dataA, carB);
    if (dataB) addMemberToCar(dataB, carA);
}

function getCarTotalScore(car, opts) {
    const mems = getCarMembersData(car);
    const driver = getDriverData(car);
    return calcGroupScore(mems, driver, opts);
}

function calcGroupScore(mems, driver, opts) {
    let score = 0;
    const occupants = [driver, ...mems];
    const passengers = mems; 

    if (passengers.length > 0) score += 100;
    if (opts.g) {
        const freshCount = passengers.filter(m => m.isFreshman).length;
        const seniorCount = passengers.filter(m => !m.isFreshman).length;
        if (freshCount > 0 && seniorCount > 0) score -= 20000; 
        else score += 5000;
        if (freshCount === 1) score -= 5000; 
        if (freshCount >= 2) score += (freshCount * 500);
    }

    const targetFemale = opts.f, targetMale = opts.m;
    if (targetFemale || targetMale) {
        const females = occupants.filter(o => o.gender === 'female').length;
        const males = occupants.filter(o => o.gender === 'male').length;
        if (targetFemale && females > 0 && males > 0) score -= 50000;
        if (targetMale && males > 0 && females > 0) score -= 50000;
        
        if (targetFemale && females > 0) {
            if (females === 1) score -= 10000; 
            else score += 5000; 
        }
        if (targetMale && males > 0) {
            if (males === 1) score -= 10000;
            else score += 5000;
        }
    }
    return score;
}

function calculateMemberScore(member, occupants, opts) {
    let score = 0;
    const passengers = occupants.filter(o => !o.isDriver);
    if (passengers.length === 0) score += 50;
    else score += 100;

    if (opts.g) {
        const sameGrade = passengers.filter(o => o.isFreshman === member.isFreshman).length;
        const diffGrade = passengers.filter(o => o.isFreshman !== member.isFreshman).length;
        if (diffGrade > 0) score -= 10000; 
        if (sameGrade > 0) score += 5000;
    }
    if ((opts.f && member.gender === 'female') || (opts.m && member.gender === 'male')) {
        const diffGender = occupants.filter(o => o.gender !== member.gender && o.gender !== 'unknown').length;
        if (diffGender > 0) score -= 20000; 
        else {
            const sameGender = occupants.filter(o => o.gender === member.gender).length;
            score += 5000;
        }
    }
    return score;
}

function executeBatch() {
    const p=id=>$(id).value.split(/\n/).map(s=>s.trim()).filter(Boolean);
    const m=p('#batchMembers'), f=p('#batchFreshmen'), d=p('#batchDrivers');
    if(!m.length&&!f.length&&!d.length) return alert('空です');
    m.forEach(n=>detectGender(n,addMember(n))); f.forEach(n=>detectGender(n,addMember(n,'','unknown',true)));
    d.forEach(n=>{addCar(n,3); detectGender(n,$('.driver-seat',$$('.car-box')[$$('.car-box').length-1]),true);});
    save(); modals.batch.hide(); alert(`完了: 同乗${m.length+f.length} 車${d.length}`);
}

function handleEdit(type, el) {
    const box=el.closest('.car-box'), card=el.closest('.member-card');
    const MAP = {
        capacity: { t:'定員変更', v:()=>box.dataset.capacity, set:v=>{if(getInt(v)>0)box.dataset.capacity=getInt(v);} },
        carName: { t:'車名変更', v:()=>$('.driver-name-disp',box).innerText, set:v=>{if(v){$('.driver-name-disp',box).innerText=v;$('.car-name-text',box).innerText=v+' 車';}} },
        name: { t:'名前修正', v:()=>$('.member-name-text',card).innerText, set:v=>{if(v)$('.member-name-text',card).innerText=v;} },
        memo: { t:'メモ', v:()=>$('.memo-popup',card).innerText, set:v=>upMemo(card,v) },
        driverMemo: { t:'運転手メモ', v:()=>$('.driver-memo-text',el.closest('.driver-seat')).innerText, set:v=>upMemo(el.closest('.driver-seat'),v,'.driver-memo-text') }
    };
    const c=MAP[type]; $('#editModalTitle').innerText=c.t; $('#editModalInput').value=c.v();
    saveCb=()=>{c.set($('#editModalInput').value); updateUI(); save(); modals.edit.hide();};
    modals.edit.show(); setTimeout(()=>$('#editModalInput').focus(),500);
}

const upMemo = (p,v,s='.memo-popup') => { const m=$(s,p),i=$('.memo-indicator',p); m.innerText=v; m.style.display=v?'block':'none'; i.classList.toggle('empty',!v); };
function updateUI() {
    $$('.car-box').forEach(b => {
        const c=getInt(b.dataset.capacity), n=$$('.member-card',b).length, bad=$('.capacity-badge',b);
        bad.textContent=`同乗 ${n} / ${c}`; b.classList.toggle('over-capacity',n>c);
        bad.className=`badge capacity-badge me-2 bg-${n>c?'danger':(n===c?'success':'secondary')}`;
        $$('.state-action-btn',b).forEach(e=>{e.className='fas fa-reply action-btn return-btn state-action-btn';e.title='戻す';e.setAttribute('data-action','return');});
    });
    $$('#waiting-list .state-action-btn').forEach(e=>{e.className='fas fa-times action-btn delete-btn state-action-btn';e.title='削除';e.setAttribute('data-action','delete');});
}

function getMemData(el) { return {name:$('.member-name-text',el).innerText, memo:$('.memo-popup',el).innerText, gender:el.dataset.gender, isFreshman:el.dataset.freshman==='true', locked:el.dataset.locked==='true'}; }
function getData() { return { waiting: Array.from($$('#waiting-list .member-card')).map(getMemData), cars: Array.from($$('.car-box')).map(c=>({ name:$('.driver-name-disp',c).innerText, capacity:c.dataset.capacity, driverMemo:$('.driver-memo-text',c).innerText, driverGender:$('.driver-seat',c).dataset.gender, members:[...$$('.passenger-seat .member-card',c),...$$('.rear-seats .member-card',c)].map(getMemData) })) }; }
function save() { 
    const d = getData();
    L.setItem(CFG.STORE, J.stringify(d)); 
    // Firebaseへ送信（リモート更新中でなければ）
    if (!isRemoteUpdate && dbRef) {
        set(dbRef, d).catch(e => console.error(e));
    }
}
function load() { 
    // 初回ロード時はFirebaseのリスナーを開始
    onValue(dbRef, (snapshot) => {
        const val = snapshot.val();
        if (val) {
            isRemoteUpdate = true; // フラグを立てて無限ループ防止
            restore(val);
            isRemoteUpdate = false;
        } else {
            // Firebaseにデータがない場合のみローカルストレージを見る（または既存データをアップロード）
            const local = J.parse(L.getItem(CFG.STORE));
            if(local) { restore(local); save(); } 
        }
    });
}
function restore(d) { 
    $('#waiting-list').innerHTML=''; 
    $('#cars-container').innerHTML=''; 
    const n=m=>typeof m==='string'?{name:m}:m; 
    (d.waiting||[]).forEach(m=>{const x=n(m);addMember(x.name,x.memo,x.gender,x.isFreshman, $('#waiting-list'), x.locked);}); 
    (d.cars||[]).forEach(c=>addCar(c.name,c.capacity,(c.members||[]).map(n),c.driverMemo,c.driverGender)); 
    updateUI(); 
    // ここでの save() は削除 (無限ループ防止のため)
}
function copy(t) { navigator.clipboard.writeText(t).then(()=>alert('コピー完了'),()=>alert('失敗')); }
function copyLine() {
    const d=getData(); let t="【山歩会 車割表】\n\n";
    d.cars.forEach(c=>{ t+=`🚗 ${c.name} 車 ${c.members.length>=c.capacity?"🈵":`(あと${c.capacity-c.members.length}人)`}\n  [運転] ${c.name}${c.driverMemo?` (${c.driverMemo})`:''}\n  [同乗] ${c.members.map(m=>m.name+(m.isFreshman?'🔰':'')+(m.memo?`(${m.memo})`:'')).join(", ")||"なし"}\n\n`;});
    if(d.waiting.length) t+="📍 未割当\n"+d.waiting.map(m=>m.name+(m.isFreshman?'🔰':'')+(m.memo?`(${m.memo})`:'')).join(", ")+"\n";
    copy(t+"\nツール: "+location.href.split('?')[0]);
}
