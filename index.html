<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>山歩会 車割メーカー</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            /* ベーステーマ (Nature/Clean) */
            --primary-color: #0d9488; /* Teal */
            --primary-hover: #0f766e;
            --accent-color: #f59e0b; /* Amber */
            
            --bg-body: #f3f4f6;
            --bg-surface: #ffffff;
            --bg-glass: rgba(255, 255, 255, 0.85);
            
            --text-main: #1f2937;
            --text-muted: #6b7280;
            
            --border-color: #e5e7eb;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            
            /* 性別・属性カラー (パステル調に調整) */
            --male-bg: #eff6ff;
            --male-border: #bfdbfe;
            --male-text: #1e40af;
            
            --female-bg: #fff1f2;
            --female-border: #fecdd3;
            --female-text: #9f1239;
            
            --freshman-color: #10b981;

            /* 座席・UI */
            --seat-bg: #f9fafb;
            --seat-empty-border: #d1d5db;
            --drag-over: #e0f2fe;
            
            --driver-bg: #f3f4f6;
            --driver-border: #d1d5db;

            --input-bg: #ffffff;
            --input-text: #1f2937;
        }

        [data-theme="dark"] {
            --primary-color: #2dd4bf;
            --primary-hover: #14b8a6;
            
            --bg-body: #111827;
            --bg-surface: #1f2937;
            --bg-glass: rgba(31, 41, 55, 0.9);
            
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            
            --border-color: #374151;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.3);
            
            --male-bg: #1e3a8a;
            --male-border: #1d4ed8;
            --male-text: #dbeafe;
            
            --female-bg: #831843;
            --female-border: #be185d;
            --female-text: #fce7f3;

            --seat-bg: #111827;
            --seat-empty-border: #4b5563;
            --drag-over: #374151;
            
            --driver-bg: #111827;
            --driver-border: #4b5563;

            --input-bg: #374151;
            --input-text: #f3f4f6;
        }

        body { 
            background-color: var(--bg-body); 
            color: var(--text-main);
            font-family: 'Noto Sans JP', sans-serif;
            padding-bottom: 140px; 
            transition: background-color 0.3s ease, color 0.3s ease;
            font-size: 0.9rem;
            -webkit-font-smoothing: antialiased;
        }

        /* 共通コンポーネント */
        .btn-primary { background-color: var(--primary-color); border-color: var(--primary-color); }
        .btn-primary:hover { background-color: var(--primary-hover); border-color: var(--primary-hover); }
        .text-primary { color: var(--primary-color) !important; }

        .card-panel {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: var(--shadow-sm);
            margin-bottom: 1rem;
            padding: 1rem;
        }

        /* フォーム要素 */
        .form-control, .form-select, .input-group-text {
            background-color: var(--input-bg);
            color: var(--input-text);
            border-color: var(--border-color);
            border-radius: 6px;
        }
        .form-control:focus {
            background-color: var(--input-bg);
            color: var(--input-text);
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.25rem rgba(13, 148, 136, 0.25);
        }

        /* メンバーカード (改良版) */
        .member-card {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 4px 8px;
            cursor: grab;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            margin-bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 44px;
            position: relative;
            transition: transform 0.1s, box-shadow 0.1s;
        }
        .member-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
        .member-card:active { cursor: grabbing; opacity: 0.9; }

        /* 性別ごとのスタイル */
        .member-card[data-gender="male"] { background-color: var(--male-bg); border-color: var(--male-border); color: var(--male-text); }
        .member-card[data-gender="female"] { background-color: var(--female-bg); border-color: var(--female-border); color: var(--female-text); }

        .card-row-main {
            display: flex;
            align-items: center;
            width: 100%;
            gap: 6px;
        }
        .member-name-text {
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex-grow: 1;
        }
        
        /* アイコン類 */
        .gender-icon { cursor: pointer; opacity: 0.8; font-size: 0.9em; width: 16px; text-align: center; }
        .freshman-icon { color: var(--freshman-color); font-size: 0.85em; }
        
        /* ツールバー (カード下部) */
        .card-tools {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-top: 2px;
            font-size: 0.75rem;
            opacity: 0.7;
        }
        .card-tools:hover { opacity: 1; }
        .tool-btn { cursor: pointer; padding: 2px; transition: color 0.2s; }
        .tool-btn:hover { color: var(--text-main); }
        .tool-btn.delete:hover { color: #ef4444; }

        /* メモ */
        .memo-badge {
            font-size: 0.7rem;
            background: #fef3c7;
            color: #92400e;
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid #fcd34d;
            margin-top: 3px;
            display: none;
            word-break: break-all;
            line-height: 1.2;
        }
        [data-theme="dark"] .memo-badge { background: #78350f; color: #fef3c7; border-color: #92400e; }
        .memo-indicator { color: var(--accent-color); font-size: 0.8rem; }
        .memo-indicator.empty { color: var(--border-color); }

        /* 車両ボックス */
        .car-box {
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px;
            box-shadow: var(--shadow-sm);
            height: 100%;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s;
        }
        .car-box.over-capacity { border: 2px solid #ef4444; }

        .car-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid var(--border-color);
        }
        .car-title { font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 8px; }
        
        /* 車内レイアウト */
        .car-interior {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-grow: 1;
        }
        
        .seat-area {
            min-height: 50px;
            border-radius: 8px;
            padding: 4px;
            background-color: var(--seat-bg);
            border: 1px dashed var(--seat-empty-border);
            transition: background-color 0.2s, border-color 0.2s;
            position: relative;
        }
        /* 空席時のガイド表示 */
        .seat-area:empty::after {
            content: 'Drop here';
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.7rem;
            color: var(--text-muted);
            opacity: 0.5;
            pointer-events: none;
        }
        
        .sortable-area.drag-over { background-color: var(--drag-over); border-color: var(--primary-color); border-style: solid; }

        .front-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .rear-seats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; align-content: start; flex-grow: 1; }

        /* 運転席 */
        .driver-seat {
            background-color: var(--driver-bg);
            border: 1px solid var(--driver-border);
            border-radius: 8px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }
        /* ハンドルアイコン（背景） */
        .driver-seat::before {
            content: '\f1b9'; /* fa-car-steering is not in standard free set sometimes, using car-side or similar if needed, sticking to simple */
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            bottom: -5px; right: -5px;
            font-size: 3rem;
            opacity: 0.05;
            transform: rotate(-15deg);
            pointer-events: none;
            color: var(--text-main);
        }
        
        .driver-label {
            font-size: 0.6rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
            display: flex;
            justify-content: space-between;
        }

        .driver-seat[data-gender="male"] { background: var(--male-bg); color: var(--male-text); border-color: var(--male-border); }
        .driver-seat[data-gender="female"] { background: var(--female-bg); color: var(--female-text); border-color: var(--female-border); }

        /* 待機リスト */
        .waiting-area {
            background-color: var(--seat-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 8px;
            min-height: 120px;
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            align-content: flex-start;
        }
        .waiting-area .member-card {
            width: calc(33.333% - 4px);
        }
        @media (max-width: 768px) { .waiting-area .member-card { width: calc(50% - 3px); } }

        /* シェアバー (Floating Bottom) */
        .share-bar {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 500px;
            background: var(--bg-glass);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            padding: 10px 16px;
            border-radius: 50px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            display: flex;
            gap: 10px;
        }

        .sortable-ghost { background-color: var(--border-color) !important; opacity: 0.4; }
        
        /* モーダル */
        .modal-content { background-color: var(--bg-surface); color: var(--text-main); border: 1px solid var(--border-color); }
        .modal-header, .modal-footer { border-color: var(--border-color); }
        .btn-close { filter: var(--bs-btn-close-filter); }
        [data-theme="dark"] .btn-close { filter: invert(1); }

        /* トグルスイッチ */
        .theme-toggle {
            cursor: pointer;
            padding: 8px;
            border-radius: 50%;
            background: transparent;
            color: var(--text-main);
            transition: background 0.3s;
        }
        .theme-toggle:hover { background: rgba(0,0,0,0.1); }
        [data-theme="dark"] .theme-toggle:hover { background: rgba(255,255,255,0.1); }

    </style>
</head>
<body data-theme="light">

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>

<script>
    const GENDER_API_KEY = '6974b918d0998f075852411e'; 
    const STORAGE_KEY = 'sampokai_car_data_v9_ui_refresh';
    let editModalInstance = null;
    let batchModalInstance = null;
    let saveCallback = null;
    let currentTheme = 'light';

    document.addEventListener('DOMContentLoaded', () => {
        editModalInstance = new bootstrap.Modal(document.getElementById('commonEditModal'));
        batchModalInstance = new bootstrap.Modal(document.getElementById('batchImportModal'));
        
        document.getElementById('editModalInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') saveEditFromModal();
        });
        document.getElementById('newMemberName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') handleAddMemberClick();
        });

        // Theme Init
        initTheme();

        const urlParams = new URLSearchParams(window.location.search);
        const sharedData = urlParams.get('data');
        if (sharedData) {
            try {
                let base64 = sharedData.replace(/-/g, '+').replace(/_/g, '/');
                while (base64.length % 4) { base64 += '='; }
                const json = decodeURIComponent(escape(atob(base64)));
                restoreFromData(JSON.parse(json));
                window.history.replaceState({}, document.title, window.location.pathname);
            } catch (e) {
                console.error("Load error:", e);
                loadFromStorage();
            }
        } else {
            loadFromStorage();
        }

        setupSortable(document.getElementById('waiting-list'));
        updateWaitingCount();
    });

    // --- Theme Handling ---
    function initTheme() {
        const storedTheme = localStorage.getItem('theme');
        if (storedTheme) {
            setTheme(storedTheme);
        } else {
            // Auto detect
            const times = SunCalc.getTimes(new Date(), 35.6895, 139.6917);
            const now = new Date();
            const isNight = now > times.sunset || now < times.sunrise;
            setTheme(isNight ? 'dark' : 'light');
        }
    }

    function toggleTheme() {
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';
        setTheme(newTheme);
        localStorage.setItem('theme', newTheme);
    }

    function setTheme(theme) {
        currentTheme = theme;
        document.body.setAttribute('data-theme', theme);
        const icon = document.getElementById('theme-icon');
        if(theme === 'dark') {
            icon.classList.remove('fa-sun');
            icon.classList.add('fa-moon');
        } else {
            icon.classList.remove('fa-moon');
            icon.classList.add('fa-sun');
        }
    }

    // --- Gender Detection ---
    async function fetchGender(name) {
        if (!name || !GENDER_API_KEY) return 'unknown';
        try {
            const response = await fetch(`https://genderapi.io/api/?name=${encodeURIComponent(name)}&key=${GENDER_API_KEY}`);
            if (!response.ok) throw new Error('API Error');
            const data = await response.json();
            return data.gender || 'unknown';
        } catch (error) {
            return 'unknown';
        }
    }
    async function autoDetectGender(name, element, type) {
        if (!name) return;
        const gender = await fetchGender(name);
        if (gender !== 'unknown') {
            element.setAttribute('data-gender', gender);
            if(type === 'member') {
                updateGenderIcon(element.querySelector('.gender-icon'), gender);
            } else if (type === 'driver') {
                updateGenderIcon(element.querySelector('.driver-info .gender-icon'), gender);
            }
            saveToStorage();
        }
    }

    // --- Batch Import ---
    function openBatchModal() {
        document.getElementById('batchMembers').value = '';
        document.getElementById('batchFreshmen').value = '';
        document.getElementById('batchDrivers').value = '';
        batchModalInstance.show();
    }
    function executeBatchImport() {
        const memberText = document.getElementById('batchMembers').value;
        const freshmanText = document.getElementById('batchFreshmen').value;
        const driverText = document.getElementById('batchDrivers').value;
        const defaultCap = 3;

        const memberList = memberText.split(/\n/).map(s => s.trim()).filter(s => s !== '');
        const freshmanList = freshmanText.split(/\n/).map(s => s.trim()).filter(s => s !== '');
        const driverList = driverText.split(/\n/).map(s => s.trim()).filter(s => s !== '');

        if (memberList.length === 0 && freshmanList.length === 0 && driverList.length === 0) {
            alert('入力が空です');
            return;
        }

        memberList.forEach(name => {
            const el = addMemberToDOM(name, '', 'unknown', false);
            autoDetectGender(name, el, 'member');
        });
        freshmanList.forEach(name => {
            const el = addMemberToDOM(name, '', 'unknown', true);
            autoDetectGender(name, el, 'member');
        });
        driverList.forEach(name => {
            addCar(name, defaultCap, [], '', 'unknown');
            const cars = document.querySelectorAll('.car-box');
            if(cars.length > 0) {
                const lastCar = cars[cars.length - 1];
                const driverSeat = lastCar.querySelector('.driver-seat');
                autoDetectGender(name, driverSeat, 'driver');
            }
        });

        saveToStorage();
        batchModalInstance.hide();
        alert(`登録完了: 同乗者${memberList.length + freshmanList.length}人 / 車${driverList.length}台`);
    }

    function handleAddMemberClick() {
        const input = document.getElementById('newMemberName');
        const name = input.value;
        if (!name) return;
        input.value = '';
        const el = addMemberToDOM(name, '', 'unknown', false);
        saveToStorage();
        autoDetectGender(name, el, 'member');
    }

        div.innerHTML = `
            <div class="card-row-main">
                <i class="${iconClass} gender-icon" onclick="toggleGender(this)"></i>
                <span class="member-name-text" title="${name}">${name}${freshmanMark}</span>
                <i class="fas fa-ellipsis-v text-muted" style="font-size:0.7rem; opacity:0.5;"></i>

    // --- Auto Assign Logic (Standard) ---
    function autoAssign(mode) {
        const groupFemale = document.getElementById('optGroupGenderFemale').checked;
        const groupMale = document.getElementById('optGroupGenderMale').checked;
        const groupGrade = document.getElementById('optGroupGrade').checked;

        const allMembers = [];
        const waitingList = document.getElementById('waiting-list');
        
        const collect = (container) => {
            Array.from(container.querySelectorAll('.member-card')).forEach(card => {
                allMembers.push(extractMemberData(card));
                card.remove();
            });
        };

        if (mode === 'shuffle') {
            if(!confirm("車に乗っているメンバーも含めて全員をシャッフルしますか？")) return;
            collect(waitingList);
            document.querySelectorAll('.car-box').forEach(car => {
                collect(car.querySelector('.passenger-seat'));
                collect(car.querySelector('.rear-seats'));
                updateCapacityDisplay(car);
            });
        } else {
            collect(waitingList);
        }

        if (allMembers.length === 0) return;

        allMembers.sort(() => Math.random() - 0.5);

        if (groupFemale || groupMale || groupGrade) {
            allMembers.sort((a, b) => {
                let scoreA = 0; let scoreB = 0;
                if (groupGrade) {
                    if (a.isFreshman) scoreA -= 2000;
                    if (b.isFreshman) scoreB -= 2000;
                }
                if (groupFemale) {
                    if (a.gender === 'female') scoreA -= 1000;
                    if (b.gender === 'female') scoreB -= 1000;
                }
                if (groupMale) {
                    if (a.gender === 'male') scoreA -= 500;
                    if (b.gender === 'male') scoreB -= 500;
                }
                return scoreA - scoreB;
            });
        }

        const cars = Array.from(document.querySelectorAll('.car-box'));
        cars.sort(() => Math.random() - 0.5);
        
        for (let member of allMembers) {
            let bestCar = null;
            let bestScore = -Infinity;

            for (let car of cars) {
                const capacity = parseInt(car.dataset.capacity);
                const currentCount = getCurrentCount(car);
                if (currentCount >= capacity) continue;

                let score = 0;
                const membersInCar = getCarMemberData(car);
                
                if (groupGrade) {
                    const sameGradeCount = membersInCar.filter(m => m.isFreshman === member.isFreshman).length;
                    if (sameGradeCount > 0) score += 100;
                    score -= (sameGradeCount * 20);
                }

                const dSeat = car.querySelector('.driver-seat');
                const dGender = dSeat ? dSeat.getAttribute('data-gender') : 'unknown';

                if (groupFemale && member.gender === 'female') {
                    if (dGender === 'female') score += 50;
                    const sameGenderCount = membersInCar.filter(m => m.gender === 'female').length;
                    if (sameGenderCount > 0) score += 50;
                    score -= (sameGenderCount * 10);
                }

                if (groupMale && member.gender === 'male') {
                    if (dGender === 'male') score += 20;
                    const sameGenderCount = membersInCar.filter(m => m.gender === 'male').length;
                    if (sameGenderCount > 0) score += 20;
                    score -= (sameGenderCount * 10);
                }

                if (score > bestScore) {
                    bestScore = score;
                    bestCar = car;
                }
            }

            if (bestCar) {
                const passArea = bestCar.querySelector('.passenger-seat');
                const rearArea = bestCar.querySelector('.rear-seats');
                const target = (passArea.children.length === 0) ? passArea : rearArea;
                addMemberToDOM(member.name, member.memo, member.gender, member.isFreshman, target);
                updateCapacityDisplay(bestCar);
            } else {
                addMemberToDOM(member.name, member.memo, member.gender, member.isFreshman, waitingList);
            }
        }

        avoidSoloGranular(cars, groupFemale, groupMale, groupGrade);
        updateAllCapacities();
        updateWaitingCount();
        saveToStorage();
    }

    function getCarMemberData(car) {
        const cards = Array.from(car.querySelectorAll('.passenger-seat .member-card, .rear-seats .member-card'));
        return cards.map(c => extractMemberData(c));
    }

    function avoidSoloGranular(cars, checkFemale, checkMale, checkGrade) {
        const typesToCheck = [];
        if (checkFemale && checkGrade) {
            typesToCheck.push({ g: 'female', f: true });
            typesToCheck.push({ g: 'female', f: false });
        } else if (checkFemale) {
            typesToCheck.push({ g: 'female', f: null });
        }
        if (checkMale && checkGrade) {
            typesToCheck.push({ g: 'male', f: true });
            typesToCheck.push({ g: 'male', f: false });
        } else if (checkMale) {
            typesToCheck.push({ g: 'male', f: null });
        }
        if (!checkFemale && !checkMale && checkGrade) {
             typesToCheck.push({ g: null, f: true });
             typesToCheck.push({ g: null, f: false });
        }

        for (let i = 0; i < 3; i++) { 
            cars.forEach(car => {
                typesToCheck.forEach(type => {
                    fixSpecificTypeSolo(car, type, cars);
                });
            });
        }
    }

    function fixSpecificTypeSolo(targetCar, typeDef, allCars) {
        const passengers = Array.from(targetCar.querySelectorAll('.passenger-seat .member-card, .rear-seats .member-card'));
        const driverSeat = targetCar.querySelector('.driver-seat');
        const dGender = driverSeat.getAttribute('data-gender');
        
        const matchingPassengers = passengers.filter(p => isMatch(p, typeDef));
        let totalMatches = matchingPassengers.length;
        
        if (typeDef.g && dGender === typeDef.g) {
            if (typeDef.f === true) { }
            else { totalMatches++; } 
        }

        if (totalMatches === 1 && matchingPassengers.length === 1) {
            const soloPerson = matchingPassengers[0];
            for (let otherCar of allCars) {
                if (otherCar === targetCar) continue;
                const otherPassengers = Array.from(otherCar.querySelectorAll('.passenger-seat .member-card, .rear-seats .member-card'));
                const otherDGender = otherCar.querySelector('.driver-seat').getAttribute('data-gender');
                
                const otherMatches = otherPassengers.filter(p => isMatch(p, typeDef));
                let otherTotal = otherMatches.length;
                if (typeDef.g && otherDGender === typeDef.g && typeDef.f !== true) otherTotal++;

                if (otherTotal === 1 && otherMatches.length === 1) {
                    const friend = otherMatches[0];
                    const mySwapToken = passengers.find(p => !isMatch(p, typeDef));
                    if (mySwapToken) {
                        swapElements(mySwapToken, friend);
                        return; 
                    } else {
                        const otherSwapToken = otherPassengers.find(p => !isMatch(p, typeDef));
                        if (otherSwapToken) {
                            swapElements(soloPerson, otherSwapToken);
                            return;
                        }
                    }
                }
                if (otherTotal >= 3 && otherMatches.length >= 1) {
                    const friend = otherMatches[0];
                    const mySwapToken = passengers.find(p => !isMatch(p, typeDef));
                    if (mySwapToken) {
                        swapElements(mySwapToken, friend);
                        return;
                    }
                }
            }
        }
    }

    function isMatch(element, typeDef) {
        const g = element.getAttribute('data-gender');
        const f = element.getAttribute('data-freshman') === 'true';
        if (typeDef.g && g !== typeDef.g) return false;
        if (typeDef.f !== null && f !== typeDef.f) return false;
        return true;
    }

    function swapElements(el1, el2) {
        const parent1 = el1.parentNode;
        const parent2 = el2.parentNode;
        const next1 = el1.nextSibling;
        const next2 = el2.nextSibling;
        parent1.insertBefore(el2, next1);
        parent2.insertBefore(el1, next2);
    }

    function extractMemberData(card) {
        return {
            name: card.querySelector('.member-name-text').textContent.replace('🔰','').trim(),
            memo: card.querySelector('.memo-badge').innerText,
            gender: card.getAttribute('data-gender'),
            isFreshman: card.getAttribute('data-freshman') === 'true'
        };
    }

    function getCurrentCount(carBox) {
        return carBox.querySelectorAll('.passenger-seat .member-card, .rear-seats .member-card').length;
    }

    // --- Utility Functions ---
    function getIconClass(gender) {
        if(gender === 'male') return 'fas fa-mars';
        if(gender === 'female') return 'fas fa-venus';
        return 'fas fa-user';
    }
    
    function updateGenderIcon(iconElement, gender) {
        if(!iconElement) return;
        iconElement.className = getIconClass(gender) + (iconElement.classList.contains('gender-icon') ? ' gender-icon' : ' gender-icon me-1');
    }
    function toggleGender(btn) {
        const card = btn.closest('.member-card');
        const current = card.getAttribute('data-gender');
        const next = getNextGender(current);
        card.setAttribute('data-gender', next);
        updateGenderIcon(btn, next);
        saveToStorage();
    }
    function toggleDriverGender(btn) {
        const seat = btn.closest('.driver-seat');
        const current = seat.getAttribute('data-gender');
        const next = getNextGender(current);
        seat.setAttribute('data-gender', next);
        updateGenderIcon(btn, next);
        saveToStorage();
    }
    function getNextGender(current) {
        if (!current || current === 'unknown') return 'male';
        if (current === 'male') return 'female';
        return 'unknown';
    }

    function getCurrentData() {
        const data = { waiting: [], cars: [] };
        const getMem = (el) => extractMemberData(el);

        document.querySelectorAll('#waiting-list .member-card').forEach(el => data.waiting.push(getMem(el)));
        document.querySelectorAll('.car-box').forEach(car => {
            const driverSeat = car.querySelector('.driver-seat');
            const driverGender = driverSeat ? driverSeat.getAttribute('data-gender') : 'unknown';
            const driverName = car.querySelector('.driver-name-disp').innerText;
            const driverMemo = car.querySelector('.driver-memo-text').innerText;
            
            const members = [];
            car.querySelectorAll('.passenger-seat .member-card').forEach(el => members.push(getMem(el)));
            car.querySelectorAll('.rear-seats .member-card').forEach(el => members.push(getMem(el)));

            data.cars.push({
                name: driverName,
                capacity: car.dataset.capacity,
                driverMemo: driverMemo,
                driverGender: driverGender, 
                members: members
            });
        });
        return data;
    }

    function restoreFromData(data) {
        document.getElementById('waiting-list').innerHTML = '';
        document.getElementById('cars-container').innerHTML = '';
        const norm = (m) => {
            if (typeof m === 'string') return { name: m, memo: '', gender: 'unknown', isFreshman: false };
            return { 
                name: m.name, 
                memo: m.memo || '', 
                gender: m.gender || 'unknown',
                isFreshman: m.isFreshman || false 
            };
        };
        if(data.waiting) data.waiting.forEach(m => {
            const n = norm(m);
            addMemberToDOM(n.name, n.memo, n.gender, n.isFreshman);
        });
        if(data.cars) data.cars.forEach(c => {
            const dMemo = c.driverMemo || '';
            const dGender = c.driverGender || 'unknown';
            const mems = c.members.map(norm);
            addCar(c.name, c.capacity, mems, dMemo, dGender);
        });
        updateAllCapacities();
        updateWaitingCount();
        saveToStorage();
    }

    function saveToStorage() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(getCurrentData()));
    }
    function loadFromStorage() {
        const json = localStorage.getItem(STORAGE_KEY);
        if (json) restoreFromData(JSON.parse(json));
    }

    function clearAssignments() {
        if(!confirm('全ての同乗者を未割当に戻しますか？')) return;
        const waitingList = document.getElementById('waiting-list');
        document.querySelectorAll('.passenger-seat .member-card, .rear-seats .member-card').forEach(m => waitingList.appendChild(m));
        updateAllCapacities();
        updateWaitingCount();
        saveToStorage();
    }

        document.getElementById('editModalTitle').innerText = title;
        const input = document.getElementById('editModalInput');
        input.value = initialValue;
        saveCallback = callback;
        editModalInstance.show();

            const num = parseInt(newCap);

        const headerNameSpan = carBox.querySelector('.car-name-text');

        const memoDiv = driverSeat.querySelector('.driver-memo-text');
        const icon = btn.classList.contains('memo-indicator') ? btn : btn.closest('.driver-seat').querySelector('.memo-indicator');

            memoDiv.innerText = newMemo;

        });

    function editMemberName(btn) {
        const nameSpan = btn.closest('.member-card').querySelector('.member-name-text');
        const textOnly = nameSpan.textContent.replace('🔰','');
        openEditModal('名前の修正', textOnly, (newName) => {
            if (newName) { 
                const isFresh = btn.closest('.member-card').getAttribute('data-freshman') === 'true';

        const memoDiv = card.querySelector('.memo-badge');
        const icon = card.querySelector('.memo-indicator');
        openEditModal('メモ', memoDiv.innerText, (newMemo) => {
            memoDiv.innerText = newMemo;
            memoDiv.style.display = newMemo ? 'block' : 'none';
            if(newMemo) icon.classList.remove('empty'); else icon.classList.add('empty');
            saveToStorage();
        });
    }
    function handleMemberAction(btn) {
        if (btn.classList.contains('delete')) {
            const card = btn.closest('.member-card');
            const parent = card.parentNode;
            if (parent.id === 'waiting-list') {
                // 待機リストなら削除
                if(confirm('メンバーを削除しますか？')) {
                    card.remove();
                    updateWaitingCount();
                    saveToStorage();
                }
            } else {
                // 車内なら待機リストへ戻す
                document.getElementById('waiting-list').appendChild(card);
                updateAllCapacities();
                updateWaitingCount();
                saveToStorage();
            }
        }
    }

    function copyShareLink() {
        const data = getCurrentData();
        const json = JSON.stringify(data);
        const base64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        const url = `${window.location.origin}${window.location.pathname}?data=${base64}`;
        navigator.clipboard.writeText(url).then(() => alert('✅ URLをコピーしました'), () => alert('失敗しました'));
    }

    function copyTextForLine() {
        const data = getCurrentData();
        let text = "【山歩会 車割表】\n\n";
        data.cars.forEach(car => {
            const current = car.members.length;
            const cap = car.capacity;
            const status = (current >= cap) ? "🈵" : `(あと${cap - current}人)`;
            
            text += `🚗 ${car.name} 車 ${status}\n`;
            const driverMemoStr = car.driverMemo ? ` (${car.driverMemo})` : "";
            text += `  [運転] ${car.name}${driverMemoStr}\n`;
            
            if (car.members.length > 0) {
                text += `  [同乗] ` + car.members.map(m => {
                    let disp = m.name;
                    if(m.isFreshman) disp += "🔰";
                    if(m.memo) disp += `(${m.memo})`;
                    return disp;
                }).join(", ");
            } else {
                text += `  [同乗] なし`;
            }
            text += "\n\n";
        });
        if (data.waiting.length > 0) {
            text += "📍 未割当\n" + data.waiting.map(m => {
                let disp = m.name;
                if(m.isFreshman) disp += "🔰";
                if(m.memo) disp += `(${m.memo})`;
                return disp;
            }).join(", ") + "\n";
        }
        text += "\nツール: " + window.location.href.split('?')[0];
        navigator.clipboard.writeText(text).then(() => alert('📋 LINE用にコピーしました'));
    }

    function updateMemberIcons() {
        document.querySelectorAll('#waiting-list .member-card .state-action-btn').forEach(btn => {
            btn.className = 'fas fa-times tool-btn delete state-action-btn';
            btn.title = '削除';
        });
        document.querySelectorAll('.car-interior .member-card .state-action-btn').forEach(btn => {
            btn.className = 'fas fa-reply tool-btn state-action-btn';
            btn.title = '未割当に戻す';
        });
    }

    function updateCapacityDisplay(box) {
        const cap = parseInt(box.dataset.capacity);
        const cnt = getCurrentCount(box);
        const badge = box.querySelector('.capacity-badge');
        badge.textContent = `${cnt}/${cap}`;
        box.classList.remove('over-capacity');
        badge.className = 'badge rounded-pill me-2 capacity-badge';
        if (cnt > cap) {
            box.classList.add('over-capacity');
            badge.classList.add('bg-danger', 'text-white');
        } else if (cnt === cap) {
            badge.classList.add('bg-success', 'text-white');
        } else {
            badge.classList.add('bg-secondary', 'text-white');
        }
    }
    
    function updateWaitingCount() {
        const count = document.getElementById('waiting-list').children.length;
        document.getElementById('waiting-count').innerText = `${count}名`;
        updateMemberIcons();
    }
    
    function updateAllCapacities() {
        document.querySelectorAll('.car-box').forEach(updateCapacityDisplay);
        updateMemberIcons();
    }
    function removeCar(btn) {
        if(confirm('車を削除しますか？')) {
            const box = btn.closest('.car-box');
            box.querySelectorAll('.member-card').forEach(m => document.getElementById('waiting-list').appendChild(m));
            btn.closest('.col-lg-4').remove();
            updateAllCapacities();
            updateWaitingCount();
            saveToStorage();
        }
    }
    function resetData() {
        if(confirm('データをリセットしますか？')) {
            localStorage.removeItem(STORAGE_KEY);
            window.location.href = window.location.pathname;
        }
    }
</script>
</body>
</html>
